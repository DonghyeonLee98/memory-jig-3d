<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모리 지그 조립 연습</title>
<meta name="description" content="메모리 소자 1세대(솔라셀 지그 몸체 + SM 보드) 기판 준비와 지그 조립을 순서대로 해 보는 연습. 2세대 XB16은 보관 탭.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout as the solar jig practice pages: the bench (drawing) beside a rail; on a phone the bench sits on top and the rail scrolls below. */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --fg: #1a1d24; --muted: #5f6673; --line: #dadde3; --stage: #e8eaee;
  --accent: #2f5fa8; --ok: #1f7a4d; --bad: #b3261e; --hl: #c0392b;
  --glass: #dfe9f1; --ito: #4c8cbf; --pvk: #6b5a3c; --ag: #8e949c; --wipe: #f2c14e; --pom: #2b2f36; --pcb: #1f5b3a; --pin: #c9a227;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111318; --panel: #181b22; --fg: #e5e8ee; --muted: #9aa1ad; --line: #2b303a; --stage: #14171d;
  --accent: #7aa5e8; --ok: #5cc392; --bad: #ff8a80; --hl: #f07c6c;
  --glass: #26313b; --ito: #5d9fd4; --pvk: #8c7550; --ag: #aeb4bc; --wipe: #e0b050; --pom: #3a3f48; --pcb: #2f7a50; --pin: #d8b440; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111318; --panel: #181b22; --fg: #e5e8ee; --muted: #9aa1ad; --line: #2b303a; --stage: #14171d;
  --accent: #7aa5e8; --ok: #5cc392; --bad: #ff8a80; --hl: #f07c6c;
  --glass: #26313b; --ito: #5d9fd4; --pvk: #8c7550; --ag: #aeb4bc; --wipe: #e0b050; --pom: #3a3f48; --pcb: #2f7a50; --pin: #d8b440; color-scheme: dark }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
.app { display: flex; height: 100vh; height: 100svh; }
.stage { position: relative; flex: 1 1 auto; min-width: 0; background: var(--stage); overflow: hidden; display: grid; place-items: center; padding: 16px; }
#bench { width: 100%; height: 100%; max-width: 760px; max-height: 760px; }
#bench text { font-family: var(--font-body); fill: var(--fg); }
#bench .pad { cursor: pointer; }
#bench .pad:focus-visible { outline: none; stroke: var(--hl); stroke-width: 0.6; }
.rail { flex: 0 0 380px; min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.rail > * { flex-shrink: 0; }
a { color: var(--accent); }
.back { font-size: 12.5px; font-weight: 600; text-decoration: none; }
h1 { font-size: 19px; font-weight: 700; margin: 2px 0 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg2 button { font: inherit; font-size: 13px; padding: 8px 4px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.seg2 button + button { border-left: 1px solid var(--line); }
.seg2 button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.bar { display: flex; gap: 2px; height: 7px; }
.bar span { flex: 1; border-radius: 2px; background: var(--line); }
.bar span.done { background: var(--accent); }
.bar span.cur { background: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card .phase { font-size: 11.5px; font-weight: 600; color: var(--accent); margin: 0; }
.card h2 { font-size: 16px; margin: 2px 0 6px; font-weight: 700; text-wrap: balance; }
.card p { margin: 0; font-size: 13.5px; }
.card .tip { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.card .q { font-weight: 600; margin-top: 8px; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.picks .lab { width: 100%; font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 0; }
.pk { font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; text-align: left; display: inline-flex; gap: 7px; align-items: flex-start; }
.pk .n { flex: 0 0 auto; min-width: 19px; height: 19px; border-radius: 999px; background: var(--line); color: var(--fg); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.pk.done { border-color: var(--accent); color: var(--accent); }
.pk.done .n { background: var(--accent); color: #fff; }
.pk.kit { width: 100%; }
.pk.kit .qty { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fb { min-height: 2.6em; margin: 0; font-size: 13px; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); font-weight: 600; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details summary { cursor: pointer; font-size: 13px; font-weight: 600; }
.steps ol { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12.5px; }
.steps li.ph { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.steps button { font: inherit; width: 100%; text-align: left; background: transparent; border: 0; color: var(--fg); padding: 3px 4px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; }
.steps button.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
.steps button .s { width: 14px; color: var(--accent); }
.notes ul { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
.selftest { font-size: 12px; color: var(--muted); margin: 0; }
.hud { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 8px; font-size: 12px; color: var(--muted);
  background: var(--panel); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 9px; border-radius: 6px; pointer-events: none; }
@media (max-width: 760px) {
  .app { flex-direction: column; height: auto; min-height: 100svh; }
  .stage { flex: 0 0 auto; height: 52vh; height: 52svh; min-height: 300px; }
  .rail { flex: 1 1 auto; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <svg id="bench" viewBox="-17 -17 34 34" role="img" aria-label="기판과 지그 그림"></svg>
    <div class="hud" id="hud"></div>
  </div>
  <aside class="rail">
    <header>
      <a class="back" href="./">← 메모리 지그 3D 보기</a>
      <h1>메모리 지그 조립 연습</h1>
      <p class="sub">기판 준비부터 지그 장착까지 순서대로: 맞는 것을 고르고, 그림의 패드를 눌러 닦을 곳을 표시한다. 틀리면 이유가 나온다. 연결은 <a href="measure.html">연결하는 법</a>.</p>
    </header>
    <div class="seg2" role="group" aria-label="세대 고르기">
      <button id="tr-gen1" type="button" aria-pressed="true">1세대 · 솔라셀 몸체 + SM</button>
      <button id="tr-gen2" type="button" aria-pressed="false">2세대 · XB16 (보관)</button>
    </div>
    <div><div class="bar" id="bar"></div><div class="meta" id="meta"></div></div>
    <section class="card" id="card" aria-live="polite"></section>
    <div class="picks" id="picks"></div>
    <p class="fb" id="fb" aria-live="assertive"></p>
    <div class="ctrl">
      <button id="auto" class="btn" type="button">보기만 ▶</button>
      <button id="restart" class="btn ghost" type="button">처음부터</button>
    </div>
    <details class="steps"><summary>단계 전체 (눌러서 그 단계로)</summary><ol id="steps"></ol></details>
    <details class="notes" open><summary>확인 전 (설계 파일이 오면 맞춤)</summary><ul id="notes"></ul></details>
    <p class="selftest" id="selftest"></p>
  </aside>
</div>
<script src="assembly.js"></script>
</body>
</html>
